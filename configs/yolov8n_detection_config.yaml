pipeline:
  loader:
    name: LuxonisLoader
    preprocessing:
      keep_aspect_ratio: true
      color_space: RGB
      normalize:
        active: true
        params:
          mean: [0.0, 0.0, 0.0]
          std: [1.0, 1.0, 1.0]
    params:
      dataset_name: coco-2017
      view: [val]

  engine:
    name: onnx
    model_path: path/to/yolov8n.onnx
    params:
      providers: [CPUExecutionProvider]

  # engine:
  #   name: depthai
  #   model_path: path/to/yolov8n.rvc4.tar.xz
  #   params:
  #     device_ip: 10.12.143.173

  evaluators:
    - task_name: ""
      # Leave task_name empty for unnamed/single-task Luxonis datasets.
      # Set it explicitly if your dataset exposes multiple tasks.
      parser:
        name: YOLODetectionParser
        params:
          subtype: yolov8
          n_classes: 80
          conf_threshold: 0.25
          iou_threshold: 0.7
          max_det: 300
      metrics:
        - name: BboxMeanAveragePrecision
          params:
            iou_type: bbox
      visualizers: []
