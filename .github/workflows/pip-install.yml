name: Pip Install

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements*.txt"
      - "scripts/export_requirements.sh"
      - ".github/workflows/pip-install.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        requirements: [requirements.txt, requirements-dev.txt]
    env:
      LUXONIS_TELEMETRY_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install from the exported requirements
        run: |
          python -m pip install --upgrade "pip>=23.3"
          python -m pip install -r "${{ matrix.requirements }}"
          python -m pip install --no-deps .

      - name: Import LuxonisEval
        run: python -I -c "import luxonis_eval; print(luxonis_eval.__version__)"
