name: Pre-commit

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Run pre-commit hooks
        run: >-
          uv run --locked --only-group lint prek run
          --all-files --show-diff-on-failure --color=always
        env:
          # Keep this hook for local commits, but allow CI on protected branches.
          SKIP: no-commit-to-branch
