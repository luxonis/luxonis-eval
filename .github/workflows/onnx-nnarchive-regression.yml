name: ONNX NNArchive Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  onnx-nnarchive-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          python-version: "3.11"
          enable-cache: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run segmentation metric tests
        env:
          LUXONIS_TELEMETRY_ENABLED: "false"
        run: |
          uv run --no-sync pytest tests/test_segmentation_background.py -q

      - name: Run ONNX NNArchive regression tests
        env:
          LUXONIS_TELEMETRY_ENABLED: "false"
        run: |
          uv run --no-sync pytest tests/test_onnx_nnarchive_regression.py -q
